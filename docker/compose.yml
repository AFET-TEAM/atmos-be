services:
  api:
    build: ../apps/api
    env_file: ../apps/api/.env
    ports: ["3000:3000"]

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile # içinde astro build yapıp /dist üret
    # web container sadece build artifact olabilir; dist'ı volume ile nginx'e kopyalayabilirsin

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/web/dist:/usr/share/nginx/html:ro
    ports: ["80:80"]
    depends_on: [api]
