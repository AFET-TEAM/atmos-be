server {
  listen 80;
  server_name _;

  # Astro build çıktılarını serve et
  root /usr/share/nginx/html;
  index index.html;

  # API proxy
  location /v1/ {
    proxy_pass http://api:3000/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Swagger (opsiyonel)
  location /swagger {
    proxy_pass http://api:3000/swagger;
  }

  # SPA fallback (Astro çoğu zaman ssr değil; build static)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
